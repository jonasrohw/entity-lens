image: ghcr.io/astral-sh/uv:0.9.27-python3.12-bookworm-slim

variables:
  UV_LINK_MODE: copy
  UV_CACHE_DIR: .uv-cache

cache:
  key:
    files:
      - uv.lock
  paths:
    - .uv-cache/

validate:
  script:
    - uv sync --locked
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest
    - uv run jlens reproduce --supplementary
    - uv build
  artifacts:
    paths:
      - generated/
      - dist/
    expire_in: 1 week
