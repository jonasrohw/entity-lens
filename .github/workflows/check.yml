name: Code quality

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned environment manager
        run: pipx install uv==0.9.27
      - name: Static analysis and tests
        run: ./reproduce.sh check
      - name: Verify saved artifacts
        run: uv run --locked entity-lens verify-artifacts
