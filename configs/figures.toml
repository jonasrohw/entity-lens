[style]
width_inches = 4.4
height_inches = 2.85
font_family = "serif"
serif_fonts = ["Nimbus Roman", "TeX Gyre Termes", "Times New Roman", "Tinos", "Liberation Serif", "STIXGeneral", "DejaVu Serif"]
math_fontset = "cm"
label_size = 9.0
tick_size = 8.0
annotation_size = 7.0
ink = "#3D405B"
muted = "#8D8FA0"
grid = "#E2E2E8"
fit = "#81B29A"
accent = "#F2CC8F"
edge = "white"
marker_size = 20
accent_marker_size = 30
y_limits = [-0.04, 1.08]
x_padding = 0.15

[agreement]
x_label = "lens agreement  ($-\\log_{10}$ rank of the model's top-1)"
y_label = "LRE faithfulness"

[agreement.labels]
person_native_language = [8, 10]
presidents_election_year = [6, -16]
presidents_birth_year = [6, 8]
landmark_on_continent = [-6, 8]
country_capital_city = [-10, -16]
name_gender = [-8, 8]
company_ceo = [8, 10]
person_father = [14, 8]
person_mother = [4, 20]
